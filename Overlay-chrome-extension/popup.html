<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overlay MatchTimer</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="omt-popup-header">
    <div class="omt-brand">
      <img class="omt-sp-logo" src="assets/stats-perform-mark.png" alt="" width="36" height="36" />
      <div class="omt-wordmark">OverlayMatchTimer</div>
    </div>
  </header>

  <nav class="omt-tabs" role="tablist">
    <button type="button" class="omt-tab is-active" data-tab="general">General</button>
    <button type="button" class="omt-tab" data-tab="customize">Customize</button>
  </nav>

  <section class="omt-pane is-active" data-pane="general">
    <div class="cheatsheet">
      <div class="cheatsheet-title">Shortcuts</div>
      <div class="shortcut-item"><span class="shortcut-label">Play / Pause</span><span class="shortcut-keys"><kbd>Space</kbd></span></div>
      <div class="shortcut-item"><span class="shortcut-label">Skip ±2s</span><span class="shortcut-keys"><kbd>←</kbd><kbd>→</kbd></span></div>
      <div class="shortcut-item"><span class="shortcut-label">Skip ±10s</span><span class="shortcut-keys"><kbd>Shift</kbd><kbd>→</kbd></span></div>
      <div class="shortcut-item"><span class="shortcut-label">Skip ±2m</span><span class="shortcut-keys"><kbd>Ctrl</kbd><kbd>→</kbd></span></div>
      <div class="shortcut-item"><span class="shortcut-label">Frame by Frame</span><span class="shortcut-keys"><kbd>↑</kbd><kbd>↓</kbd></span></div>
      <div class="shortcut-item"><span class="shortcut-label">Speed ± / 1.0x</span><span class="shortcut-keys"><kbd>Z</kbd><kbd>C</kbd><kbd>X</kbd></span></div>
      <div class="shortcut-item"><span class="shortcut-label">Mark kick-off</span><span class="shortcut-keys"><kbd>K</kbd></span></div>
      <div class="shortcut-item"><span class="shortcut-label">Go to Live</span><span class="shortcut-keys"><kbd>L</kbd></span></div>
      <div class="shortcut-item"><span class="shortcut-label">Hide/Show Controls</span><span class="shortcut-keys"><kbd>H</kbd></span></div>
    </div>
  </section>

  <section class="omt-pane" data-pane="customize">
    <div class="omt-soon-banner">Coming soon</div>
    <label class="omt-field">Match clock position
      <select id="clock-pos" disabled>
        <option value="top-left">Top left (default)</option>
        <option value="top-right">Top right</option>
        <option value="bottom-left">Bottom left</option>
      </select>
    </label>
    <label class="omt-field">Match clock size
      <select id="clock-size" disabled>
        <option value="medium">Medium (default)</option>
        <option value="small">Small</option>
        <option value="large">Large</option>
      </select>
    </label>
    <label class="omt-field">Match clock shape
      <select id="clock-shape" disabled>
        <option value="rounded">Rounded rectangle (default)</option>
        <option value="pill">Pill</option>
        <option value="minimal">Minimal</option>
      </select>
    </label>
    <p class="omt-note">Customisable shortcuts will save per user in chrome.storage. Defaults stay as today until this ships.</p>
  </section>

  <footer class="omt-popup-foot">v1.4.0</footer>
  <script src="popup.js"></script>
</body>
</html>
