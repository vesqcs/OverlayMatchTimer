<!DOCTYPE html>
<html lang="en" data-omt-site="inplayip">
<head>
  <meta charset="UTF-8" />
  <title>InplayIP Centre-Cover Mock</title>
  <style>
    html, body { margin: 0; height: 100%; background: #101820; color: #ccc; font-family: "Segoe UI", sans-serif; }
    .video-js {
      position: relative;
      width: 960px;
      height: 540px;
      margin: 24px auto;
      background: #000;
      overflow: hidden;
    }
    video.vjs-tech {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .vjs-control-bar, .vjs-progress-control {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 40px;
      background: rgba(0, 120, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
    }
    /* Host drawer painted over the video centre — must NOT hide our HUD
       after v2.0.2 (size-based visibility only; no elementFromPoint). */
    #host-centre-cover {
      position: absolute;
      left: 20%;
      top: 20%;
      width: 60%;
      height: 60%;
      background: rgba(180, 40, 40, 0.55);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
    }
    #host-curtain-btn {
      position: absolute;
      top: 8px;
      right: 12px;
      z-index: 60;
      padding: 6px 12px;
    }
    #status { text-align: center; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="video-js vjs-player" id="vjs">
    <video class="vjs-tech" id="tech" muted playsinline></video>
    <div class="vjs-control-bar">
      <div class="vjs-progress-control">Review Progress</div>
    </div>
    <div id="host-centre-cover">Host centre overlay</div>
    <button type="button" id="host-curtain-btn">Close curtain</button>
  </div>
  <div id="status">Cover mock ready</div>
  <script>
    (function () {
      const video = document.getElementById('tech');
      const btn = document.getElementById('host-curtain-btn');
      let clicks = 0;
      btn.addEventListener('click', () => {
        clicks += 1;
        btn.setAttribute('data-clicks', String(clicks));
        btn.textContent = 'Close curtain (' + clicks + ')';
      });
      const canvas = document.createElement('canvas');
      canvas.width = 960;
      canvas.height = 540;
      const ctx = canvas.getContext('2d');
      const t0 = performance.now();
      function draw() {
        const t = (performance.now() - t0) / 1000;
        ctx.fillStyle = '#102033';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#66b3ff';
        ctx.font = '32px sans-serif';
        ctx.fillText('COVER MOCK t=' + t.toFixed(1) + 's', 32, 64);
        requestAnimationFrame(draw);
      }
      draw();
      video.srcObject = canvas.captureStream(30);
      Object.defineProperty(video, 'duration', { configurable: true, get: () => 1200 });
      const seekable = { length: 1, start: () => 0, end: () => 1200 };
      Object.defineProperty(video, 'seekable', { configurable: true, get: () => seekable });
      let _ct = 30;
      Object.defineProperty(video, 'currentTime', {
        configurable: true,
        get: () => _ct,
        set: (v) => { _ct = Math.max(0, Math.min(1200, Number(v) || 0)); }
      });
      video.play().catch(() => {});
    })();
  </script>
</body>
</html>
