<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>nanoplayer — Xeatre live ULL mock</title>
  <style>
    html, body { margin: 0; background: #000; color: #eee; font-family: "Segoe UI", sans-serif; }
    #playerDiv {
      position: relative; width: 100%; height: 70vh; background: #000; overflow: hidden;
    }
    /* Field: VIDEO#h5live-playerDiv (nanoStream H5Live), controls=false. */
    video#h5live-playerDiv {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: contain; background: #143d2b;
    }
    /* Field host row below the video — must stay native when OMT is idle. */
    table.nano-host-tools { width: 100%; border-collapse: collapse; margin-top: 8px; }
    #ControlButtons td { padding: 6px 10px; text-align: center; }
    #ControlButtons .btn {
      background: #222; color: #ddd; border: 1px solid #555; padding: 6px 12px;
      border-radius: 4px; cursor: pointer; font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="playerDiv">
    <video id="h5live-playerDiv" playsinline muted></video>
  </div>
  <table class="nano-host-tools">
    <tbody>
      <tr id="ControlButtons">
        <td><button type="button" id="ResetPlayer" class="btn btn-sm btn-outline-secondary ToolTip" title="Reload stream">Reload stream</button></td>
        <td><button type="button" id="ReplayButton" class="btn btn-sm btn-outline-secondary ToolTip" title="Add Cuepoint">Add Cuepoint</button></td>
        <td><button type="button" id="OpenDvrPlayer" class="btn btn-sm btn-outline-secondary ToolTip" title="DVR Player">DVR Player</button></td>
      </tr>
    </tbody>
  </table>
  <script>
    (function () {
      // Field pages do not set data-omt-site; path /xeatre/nanoplayer.html is enough.
      const stats = window.__xeatreNanoStats = { play: 0, pause: 0, hostClicks: 0, player: 'h5live' };
      const v = document.getElementById('h5live-playerDiv');
      v.controls = false;
      ['play', 'pause'].forEach((type) => {
        v.addEventListener(type, () => { stats[type] += 1; });
      });
      document.querySelectorAll('#ControlButtons button').forEach((b) => {
        b.addEventListener('click', () => { stats.hostClicks += 1; });
      });
      v.src = '/xeatre-color-bars.mp4';
      v.addEventListener('loadeddata', () => {
        v.play().catch(() => {});
      }, { once: true });
      v.play().catch(() => {});
      // Mimic nanoplayer console noise — tests must ignore these.
      console.warn('Permissions policy violation: unload is not allowed in this document.');
    })();
  </script>
</body>
</html>
