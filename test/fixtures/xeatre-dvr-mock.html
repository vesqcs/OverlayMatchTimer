<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Videoplayer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0a0a0a; color: #eee; font-family: "Segoe UI", sans-serif; }
    .page { width: 960px; margin: 12px auto; display: flex; flex-direction: column; gap: 0; position: relative; }
    .video-js {
      position: relative; width: 960px; height: 540px; background: #000;
      isolation: isolate;
    }
    .video-js video.vjs-tech {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #143d2b;
    }
    .vjs-poster {
      position: absolute; inset: 0; background: #222 center/cover no-repeat; z-index: 2;
    }
    .vjs-control-bar {
      position: absolute; left: 0; right: 0; bottom: 0; height: 36px;
      display: flex; align-items: center; gap: 8px; padding: 0 10px;
      background: rgba(20,20,20,0.85); z-index: 4;
    }
    .vjs-control-bar button, .vjs-live-control {
      background: transparent; border: 0; color: #ddd; font-size: 12px; cursor: pointer;
    }
    .vjs-progress-control { flex: 1; height: 6px; background: #444; border-radius: 3px; position: relative; }
    .vjs-play-progress { position: absolute; right: 0; top: 0; bottom: 0; width: 8px; background: #e0201b; border-radius: 50%; }
    .xeatre-control-panel {
      display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px;
      background: #111; padding: 10px; border-top: 1px solid #333;
    }
    .xeatre-control-panel.floating {
      position: absolute; left: 50%; bottom: 48px; transform: translateX(-50%);
      width: 720px; border-radius: 10px; background: rgba(20,20,20,0.82);
      z-index: 6; border: 1px solid rgba(255,255,255,0.08);
    }
    .xeatre-col { display: flex; flex-direction: column; gap: 4px; align-items: stretch; }
    .xeatre-col button {
      background: #222; color: #ddd; border: 1px solid #444; padding: 6px 4px;
      font-size: 11px; cursor: pointer; border-radius: 4px;
    }
    .xeatre-col button.selected { background: #1a7a3c; border-color: #2a9a4c; color: #fff; }
    #AutoHide {
      position: absolute; right: 12px; bottom: 200px; z-index: 7;
      background: #c01818; color: #fff; border: 0; border-radius: 4px;
      padding: 4px 8px; font-size: 11px; cursor: pointer;
    }
    #ControlBar.overlay-normal {
      position: absolute; left: 8px; top: 8px; z-index: 5;
      background: #333; color: #fff; padding: 4px 8px; font-size: 11px;
    }
    #status { text-align: center; margin-top: 8px; color: #9ad; font-size: 13px; }
  </style>
</head>
<body>
  <div class="page" id="player-wrap">
    <!-- Field: Video.js player id is "hdmi-video" (shell). Tech is the inner <video>. -->
    <div id="hdmi-video" class="video-js vjs-fluid">
      <video class="vjs-tech" playsinline muted></video>
      <div class="vjs-poster" aria-hidden="true"></div>
      <div class="vjs-control-bar" role="group" aria-label="Video Controls">
        <button type="button" class="vjs-play-control" id="vjs-pause">Pause</button>
        <button type="button" class="vjs-mute-control">Vol</button>
        <div class="vjs-progress-control"><div class="vjs-play-progress" title="LIVE edge"></div></div>
        <div class="vjs-live-control">LIVE</div>
        <button type="button" class="vjs-picture-in-picture-control">PiP</button>
        <button type="button" class="vjs-fullscreen-control">FS</button>
      </div>
      <div id="ControlBar" class="overlay-normal">Host ControlBar</div>
      <div class="xeatre-control-panel floating" id="xeatre-panel-float" hidden></div>
      <button type="button" id="AutoHide">Auto hide</button>
    </div>
    <div class="xeatre-control-panel" id="xeatre-panel-dock"></div>
  </div>
  <div id="status">Waiting…</div>
  <script>
    (function () {
      document.documentElement.dataset.omtSite = 'xeatre';
      const stats = window.__xeatreStats = {
        play: 0, pause: 0, waiting: 0, hostClicks: 0, messages: 0,
        videojsInits: 0, videojsWarns: 0, paintedFrames: 0
      };
      window.__xeatreVideojsWarns = [];

      window.addEventListener('message', (ev) => {
        stats.messages += 1;
        const data = ev.data;
        if (!data || typeof data !== 'object') return;
        if (data.type === 'forcedFocus') return;
        if (ev.origin === window.location.origin && !data.isKeyPressed) {
          const v = document.querySelector('video');
          if (v) {
            if (v.paused) v.play().catch(() => {});
            else v.pause();
          }
        }
      });

      // Minimal Video.js registry that reproduces the field warning when the
      // player is initialised twice (host calls videojs('hdmi-video') again
      // after DOM mutations inside the shell).
      const players = {};
      function videojs(idOrEl, _opts) {
        const el = typeof idOrEl === 'string' ? document.getElementById(idOrEl) : idOrEl;
        const key = (el && el.id) || String(idOrEl || 'unknown');
        stats.videojsInits += 1;
        if (players[key]) {
          const msg = 'Player "' + key + '" is already initialised. Options will not be applied.';
          stats.videojsWarns += 1;
          window.__xeatreVideojsWarns.push(msg);
          console.warn('VIDEOJS: WARN: ' + msg);
          return players[key];
        }
        players[key] = {
          id: key,
          el: el,
          tech_: { vhs: null },
          tech: function () { return this.tech_; }
        };
        return players[key];
      }
      videojs.getPlayers = function () { return players; };
      window.videojs = videojs;

      // First (legitimate) host init — before the extension mounts.
      videojs('hdmi-video', { autoplay: true });

      // Hostile host: any childList mutation *inside* the VJS shell re-calls
      // videojs('hdmi-video'). Extension must NOT append into #hdmi-video.
      const shell = document.getElementById('hdmi-video');
      const mo = new MutationObserver((records) => {
        for (const r of records) {
          if (r.addedNodes && r.addedNodes.length) {
            videojs('hdmi-video', { autoplay: true });
            break;
          }
        }
      });
      mo.observe(shell, { childList: true, subtree: false });

      const COLS = [
        [
          { id: 'GoDoc', label: 'i DOC' },
          { id: 'SkipM30', label: '-30 s' },
          { id: 'Speed025', label: '0.25 Speed' }
        ],
        [
          { id: 'GoStart', label: '|< FRAME' },
          { id: 'SkipM7', label: '-7 s' },
          { id: 'Speed05', label: '0.5 Speed' }
        ],
        [
          { id: 'jwplay', label: 'PLAY / PAUSE' },
          { id: 'SkipM2', label: '-2 s' },
          { id: 'Speed1', label: '1 Speed', selected: true }
        ],
        [
          { id: 'GoLive', label: 'LIVE' },
          { id: 'SkipP2', label: '+2 s' },
          { id: 'Speed15', label: '1.5 Speed' }
        ],
        [
          { id: 'GoEnd', label: '>| FRAME' },
          { id: 'SkipP7', label: '+7 s' },
          { id: 'Speed2', label: '2 Speed' }
        ],
        [
          { id: 'FullScreen', label: 'FULL' },
          { id: 'SkipP30', label: '+30 s' },
          { id: 'RtmpBtn', label: 'RTMP' }
        ]
      ];

      function buildPanel(root, idPrefix) {
        root.innerHTML = '';
        COLS.forEach((col) => {
          const wrap = document.createElement('div');
          wrap.className = 'xeatre-col';
          col.forEach((btn) => {
            const b = document.createElement('button');
            b.type = 'button';
            b.id = idPrefix ? (idPrefix + '-' + btn.id) : btn.id;
            b.textContent = btn.label;
            if (btn.selected) b.classList.add('selected');
            b.addEventListener('click', () => { stats.hostClicks += 1; });
            wrap.appendChild(b);
          });
          root.appendChild(wrap);
        });
      }

      const dock = document.getElementById('xeatre-panel-dock');
      const flt = document.getElementById('xeatre-panel-float');
      buildPanel(dock, '');
      buildPanel(flt, 'float');
      flt.hidden = false;

      document.getElementById('AutoHide').addEventListener('click', () => {
        stats.hostClicks += 1;
      });
      document.querySelectorAll('.vjs-control-bar button').forEach((b) => {
        b.addEventListener('click', () => { stats.hostClicks += 1; });
      });

      const v = document.querySelector('#hdmi-video video.vjs-tech');
      ['play', 'pause', 'waiting'].forEach((type) => {
        v.addEventListener(type, () => { stats[type] += 1; });
      });

      // Paint visible frames via canvas captureStream so e2e can assert non-black.
      const canvas = document.createElement('canvas');
      canvas.width = 960; canvas.height = 540;
      const ctx = canvas.getContext('2d');
      const t0 = performance.now();
      (function draw() {
        const t = (performance.now() - t0) / 1000;
        ctx.fillStyle = '#143d2b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00ff88';
        ctx.font = '28px sans-serif';
        ctx.fillText('XEATRE-HDMI t=' + t.toFixed(1) + 's', 24, 48);
        stats.paintedFrames += 1;
        if (v.isConnected) requestAnimationFrame(draw);
      })();
      v.srcObject = canvas.captureStream(30);
      v.addEventListener('loadeddata', () => {
        v.play().catch(() => {});
        document.getElementById('status').textContent = 'Ready hdmi-video';
      }, { once: true });
      v.play().catch(() => {});
    })();
  </script>
</body>
</html>
