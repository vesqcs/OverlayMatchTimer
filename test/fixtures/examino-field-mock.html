<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Examino DVR field mock (unconfirmed Source, video replaced per switch)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b1220; font-family: "Segoe UI", sans-serif; color: #ddd; }
    .page { width: 640px; height: 470px; margin: 16px auto; display: flex; flex-direction: column; background: #111; position: relative; }
    .main-container.svelte-iq8mv8 { height: calc(100% - 90px); position: relative; background: #000; overflow: hidden; }
    .top.svelte-iq8mv8 { position: relative; width: 100%; height: 100%; }
    .op-player, .op-media-element-container, video { position: absolute; inset: 0; width: 100%; height: 100%; }
    video { object-fit: contain; background: #000; }
    .setting-holder { position: absolute; right: 8px; top: 40px; z-index: 7; }
    .op-setting-button { background: #333; color: #fff; border: 1px solid #666; padding: 4px 8px; cursor: pointer; }
    .op-setting-panel { display: none; position: absolute; right: 8px; top: 72px; z-index: 20; width: 220px; background: #1b1b1b; border: 1px solid #444; border-radius: 6px; padding: 8px; }
    .op-setting-panel.open { display: block; }
    .op-setting-item { display: flex; justify-content: space-between; gap: 8px; padding: 6px 4px; cursor: pointer; font-size: 12px; }
    .op-setting-item-nexticon { color: #888; }
    .op-controls { position: absolute; left: 0; right: 0; bottom: 0; height: 28px; background: rgba(255,80,0,0.35); z-index: 5; }
    .examino-bottom-controls { height: 90px; background: #1a2230; border-top: 1px solid #333; }
    #status { text-align: center; margin-top: 10px; color: #9ad; font-size: 13px; }
  </style>
</head>
<body>
  <div class="page">
    <div class="main-container svelte-iq8mv8">
      <div class="top svelte-iq8mv8">
        <div class="op-player" id="op-player">
          <div class="op-media-element-container op-clear" id="media-host"></div>
          <div class="op-controls">OpenPlayer Controls</div>
          <div class="setting-holder op-navigators op-clear">
            <button class="op-button op-setting-button" id="native-gear" type="button">⚙</button>
          </div>
          <div id="panel-mock" class="op-setting-panel"></div>
        </div>
      </div>
    </div>
    <div class="examino-bottom-controls"></div>
  </div>
  <div id="status">Waiting for player…</div>
  <script>
    (function () {
      // Field shape (Examino /play/dvr/): the Source row reports an option
      // index, not "DVR"/"VOD", so an extension can never read back the
      // switch it just made. Every Source pick makes the player tear down and
      // rebuild the <video> (pause old → new src → play new), like OpenPlayer.
      const host = document.getElementById('media-host');
      const panel = document.getElementById('panel-mock');
      const gear = document.getElementById('native-gear');
      const status = document.getElementById('status');
      const SOURCES = [{ idx: '0', label: 'DVR' }, { idx: '1', label: 'VOD' }];
      const state = { sourceIdx: '0', view: 'root' };
      const stats = window.__fieldStats = {
        sourceLoads: 0, sourcePicks: 0, gearClicks: 0,
        play: 0, pause: 0, waiting: 0, playRejections: 0, events: []
      };
      ['play', 'pause', 'waiting'].forEach((type) => {
        document.addEventListener(type, () => {
          stats[type] += 1;
          stats.events.push({ type, t: Math.round(performance.now()) });
        }, true);
      });

      function renderPanel() {
        if (state.view === 'root') {
          panel.innerHTML =
            '<div class="op-setting-title-container"><div class="op-setting-title"><span class="op-setting-title-title">Settings</span></div></div>' +
            '<div class="op-setting-item" op-panel-type="source" op-data-value="' + state.sourceIdx + '"><span class="op-setting-item-title">Source</span><span class="op-setting-item-nexticon">&gt;</span><span class="op-setting-item-value">' + state.sourceIdx + '</span></div>';
        } else {
          panel.innerHTML =
            '<div class="op-setting-title-container"><div class="op-setting-title"><span class="op-setting-title-title">Source</span></div></div>' +
            SOURCES.map((s) => '<div class="op-setting-item" op-data-value="' + s.idx + '"><span class="op-setting-item-title">' + s.label + '</span></div>').join('');
        }
        panel.querySelectorAll('.op-setting-item').forEach((item) => item.addEventListener('click', () => onItemClick(item)));
        const title = panel.querySelector('.op-setting-title');
        if (title) title.addEventListener('click', () => {
          if (state.view !== 'root') { state.view = 'root'; renderPanel(); } else panel.classList.remove('open');
        });
      }

      function onItemClick(item) {
        if (item.getAttribute('op-panel-type') === 'source') { state.view = 'source'; renderPanel(); return; }
        if (state.view === 'source') {
          stats.sourcePicks += 1;
          state.sourceIdx = item.getAttribute('op-data-value');
          state.view = 'root';
          renderPanel();
          panel.classList.remove('open');
          loadSource(state.sourceIdx);
        }
      }

      gear.addEventListener('click', () => {
        stats.gearClicks += 1;
        state.view = 'root';
        renderPanel();
        panel.classList.add('open');
      });

      function makeVideo(label) {
        const video = document.createElement('video');
        video.muted = true;
        video.playsInline = true;
        const canvas = document.createElement('canvas');
        canvas.width = 640; canvas.height = 360;
        const ctx = canvas.getContext('2d');
        const t0 = performance.now();
        (function draw() {
          ctx.fillStyle = '#143d2b';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#00ff88';
          ctx.font = '26px sans-serif';
          ctx.fillText(label + ' t=' + ((performance.now() - t0) / 1000).toFixed(1), 20, 48);
          if (video.isConnected || performance.now() - t0 < 2000) requestAnimationFrame(draw);
        })();
        video.srcObject = canvas.captureStream(30);
        return video;
      }

      function loadSource(idx) {
        stats.sourceLoads += 1;
        const label = (SOURCES.find((s) => s.idx === idx) || SOURCES[0]).label;
        const prev = host.querySelector('video');
        if (prev) { try { prev.pause(); } catch (_) {} }
        host.innerHTML = '';
        const next = makeVideo('EXAMINO-' + label + ' #' + stats.sourceLoads);
        host.appendChild(next);
        // Host-side play(); rejections here are the page's, not ours.
        next.play().catch(() => { stats.playRejections += 1; });
        status.textContent = 'Source ' + label + ' loaded (#' + stats.sourceLoads + ')';
      }

      window.__fieldPlayerOpen = () => {
        const v = host.querySelector('video');
        if (!v) return false;
        const r = v.getBoundingClientRect();
        return v.isConnected && !v.paused && v.readyState >= 2 && r.width > 100 && r.height > 100 &&
          getComputedStyle(v).display !== 'none' && getComputedStyle(v).visibility !== 'hidden';
      };

      renderPanel();
      setTimeout(() => loadSource(state.sourceIdx), 800);
    })();
  </script>
</body>
</html>
